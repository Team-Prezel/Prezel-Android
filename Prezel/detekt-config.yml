build:
    maxIssues: 0

config:
    validation: true
    warningsAsErrors: false
    checkExhaustiveness: false

processors:
    active: true

style:
    active: true
    MaxLineLength:
        active: true
        maxLineLength: 150
    MagicNumber:
        active: false
    ReturnCount:
        active: true
        max: 3
    UnusedPrivateMember:
        active: true
        ignoreAnnotated:
            - Preview
            - ThemePreview
    WildcardImport:
        active: true
    DestructuringDeclarationWithTooManyEntries:
        active: false

complexity:
    active: true
    LongMethod:
        active: true
        threshold: 40
    LongParameterList:
        active: true
        functionThreshold: 8
        constructorThreshold: 8
    CyclomaticComplexMethod:
        active: true
        threshold: 15
    NestedBlockDepth:
        active: true
        threshold: 4

naming:
    active: true
    MatchingDeclarationName:
        active: false
    FunctionNaming:
        active: true
        ignoreAnnotated:
            - Composable
            - Preview

potential-bugs:
    active: true

exceptions:
    active: true
    TooGenericExceptionCaught:
        active: false
